name: Dif
options:
  bundleIdPrefix: com.dotzero
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: 26.0
    SWIFT_VERSION: 5.0
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO
targets:
  Dif:
    type: application
    platform: macOS
    sources: [Dif]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dotzero.Dif
        INFOPLIST_KEY_CFBundleDisplayName: Dif
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: YES
        CODE_SIGN_ENTITLEMENTS: Dif/Dif.entitlements
  DifTests:
    type: bundle.unit-test
    platform: macOS
    sources: [DifTests]
    dependencies:
      - target: Dif
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dotzero.DifTests
